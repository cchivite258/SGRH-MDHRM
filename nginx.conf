server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Probe do Grafana: confirma que este frontend está a servir, sem a aplicação nem a API.
  location = /health {
    access_log off;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"status":"UP"}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}